<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and span</title>
</head>
<body>
    <!-- Header -->
     <div>
     <h1>My Website</h1>
     <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">contact</a></li>
     </ul>
     </div>
     <!-- section -->
      <div>
     <h2>Section One</h2>
     <p> This the  first paragraph in the <span style="color: blue;"> section one.</span></p>
     <p> This the  second paragraph in the   <span style="color: aqua;">section one.</span></p>
      </div>

      <div>
     <h2>Section two</h2>
     <p> This the  first paragraph in the section two.</p>
     <p> This the  second paragraph in the section two.</p>
      </div>
