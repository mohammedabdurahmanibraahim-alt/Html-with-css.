<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text formatting</title>
    <style>
   .paragraph-1{
   color: aqua;
   font-size: 25px;
   font-family: Arial;
   font-weight: bolder;
   font-style: italic;
    text-shadow: 2px  5px 5px red;
        }
        .para-2{
            text-align: right;
            line-height: 4;
            /* letter-spacing: 4px; */
            word-spacing: 10px;
        }
        .para-3{
            text-transform: uppercase;  /*lowercase capitalize*/
            text-decoration: underline; /* overline,  line through  , wavy underline*/
        }

    </style>
</head>
<body>
    <h1>Text formatting</h1>
    <p class="paragraph-1">Html is the basic language to create web pages.</p>
    <p class="para-2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit quibusdam reprehenderit quidem vitae, blanditiis beatae!</p>
    <p class="para-3">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Eaque, obcaecati explicabo? Corporis est libero cumque.</p>
</body>
</html>
