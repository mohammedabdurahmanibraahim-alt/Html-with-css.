<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
    <style>
        ul{
            list-style-type: decimal-leading-zero;   /* lower-alpha ,upper-alpha, circle, number, lower roman, upper roman*/
            list-style-position: inside;
            /* list-style-type: none; */
        }
    </style>
</head>
<body>
    <h1>Styling lists</h1>
    <ul>
        <li>list item 1</li>
        <li>list item 2</li>
        <li>list item 3</li>
        <li>list item 4</li>
    </ul>
</body>
</html>
