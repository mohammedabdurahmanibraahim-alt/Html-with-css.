<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions</title>
    <style>
        .box{
             height: 200px;
            width: 200px;
            background: orange;
            /* Transition property */
            transition-property: width, background-color;
            /* Transition duration */
            /* transition-duration: 1s; */
            /* transition -timing-function */
            transition-timing-function: ease-in;
            /* transition-delay   waa waqtiga transitionka maqnaanayo*/
            /* transition-delay: 3s; */ 
            
            /* shorthand */
            transition: width 200ms ease-in 3s;
        }

        .box:hover {
            background-color: orangered;
            width: 400px;
        }
    </style>
</head>
<body>
    <h1>Transitions</h1>
    <div class="box">

    </div>
</body>
</html>
