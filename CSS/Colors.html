<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
div{
    height: 100px;
    width: 100px;
    border: 1px solid;
}
.box-1{
    background-color: red;
    color: white;
}
.box-2{
    background-color: #ff00ff;
}
.box-3{
    background-color: rgb(0,100,25);
}
.box-4{
    background-color: rgba(125, 44, 30, 7);
}
.box-5{
    background-color: hsl(256, 70%, 60%);
}
    </style>
</head>
<body>
   <h1>CSS Colors</h1> 
 <div class="box-1">Div 1</div>
 <div class="box-2">Div 2</div>
 <div class="box-3">Div 3</div>
 <div class="box-3">Div 4</div>
 <div class="box-5">Div 5</div>


</body>
</html>
